<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квіз 6</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Квіз 6</h2>

<div>
<p>1. 15-7?</p>
<button onclick="check(this,false)">6</button>
<button onclick="check(this,true)">8</button>
</div>

<div>
<p>2. Найвища гора?</p>
<button onclick="check(this,true)">Еверест</button>
<button onclick="check(this,false)">Говерла</button>
</div>

<div>
<p>3. Скільки континентів?</p>
<button onclick="check(this,false)">5</button>
<button onclick="check(this,true)">7</button>
</div>

<div>
<p>4. Яка валюта в ЄС?</p>
<button onclick="check(this,true)">Євро</button>
<button onclick="check(this,false)">Долар</button>
</div>

<div>
<p>5. Хто винайшов лампу?</p>
<button onclick="check(this,false)">Тесла</button>
<button onclick="check(this,true)">Едісон</button>
</div>

<a href="index.html">Назад</a>

<script>
function check(btn, isCorrect){
const parent = btn.parentElement;
const buttons = parent.querySelectorAll('button');
buttons.forEach(b => b.disabled = true);
btn.classList.add(isCorrect ? 'correct' : 'wrong');
}
</script>

</body>
</html>
