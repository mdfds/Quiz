<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квіз 5</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Квіз 5</h2>

<div>
<p>1. 9×3?</p>
<button onclick="check(this,false)">21</button>
<button onclick="check(this,true)">27</button>
</div>

<div>
<p>2. Найбільша країна?</p>
<button onclick="check(this,true)">США</button>
<button onclick="check(this,false)">Китай</button>
</div>

<div>
<p>3. Скільки днів у році?</p>
<button onclick="check(this,false)">360</button>
<button onclick="check(this,true)">365</button>
</div>

<div>
<p>4. Хто написав "Кобзар"?</p>
<button onclick="check(this,false)">Франко</button>
<button onclick="check(this,true)">Шевченко</button>
</div>

<div>
<p>5. Вода кипить при?</p>
<button onclick="check(this,true)">100°C</button>
<button onclick="check(this,false)">50°C</button>
</div>

<a href="quiz4.html">Минулий квіз</a>
<a href="index.html">Головна сторінка</a>
<a href="quiz6.html">Наступний квіз</a>

<script>
function check(btn, isCorrect){
const parent = btn.parentElement;
const buttons = parent.querySelectorAll('button');
buttons.forEach(b => b.disabled = true);
btn.classList.add(isCorrect ? 'correct' : 'wrong');
}
</script>

</body>
</html>
