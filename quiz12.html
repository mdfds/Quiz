<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Квіз 12</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Складний квіз</h2>

<div>
<p>1. √169?</p>
<button onclick="check(this,false)">12</button>
<button onclick="check(this,false)">14</button>
<button onclick="check(this,true)">13</button>
</div>

<div>
<p>2. Хто створив теорію відносності?</p>
<button onclick="check(this,false)">Нікола Тесла</button>
<button onclick="check(this,true)">Альберт Ейнштейн</button>
<button onclick="check(this,false)">Ісаак Ньютон</button>
</div>

<div>
<p>3. Яка річка вважається найдовшою у світі?</p>
<button onclick="check(this,true)">Ніл</button>
<button onclick="check(this,false)">Янцзи</button>
<button onclick="check(this,false)">Амазонка</button>
</div>

<div>
<p>4. Столиця Канади?</p>
<button onclick="check(this,false)">Монреаль</button>
<button onclick="check(this,false)">Торонто</button>
<button onclick="check(this,true)">Оттава</button>
</div>

<div>
<p>5. Число π (пі) приблизно дорівнює?</p>
<button onclick="check(this,false)">3.50</button>
<button onclick="check(this,true)">3.14</button>
<button onclick="check(this,false)">3.28</button>
</div>

<br>
<a href="index.html">Назад</a>

<script>
function check(btn,c){
const p=btn.parentElement; 
p.querySelectorAll('button').forEach(b=>b.disabled=true); 
btn.classList.add(c?'correct':'wrong');
}
</script>

</body>
</html>
