<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Квіз 1</title>
  <style>
    button { margin:5px; padding:8px; }
    .correct { background-color: lightgreen; }
    .wrong { background-color: lightcoral; }
  </style>
</head>
<body>
  <h2>Квіз 1</h2>

  <div>
    <p>1. Столиця України?</p>
    <button onclick="check(this,true)">Київ</button>
    <button onclick="check(this,false)">Львів</button>
  </div>

  <div>
    <p>2. 2+2?</p>
    <button onclick="check(this,true)">4</button>
    <button onclick="check(this,false)">5</button>
  </div>

  <div>
    <p>3. Колір неба?</p>
    <button onclick="check(this,true)">Синій</button>
    <button onclick="check(this,false)">Червоний</button>
  </div>

  <div>
    <p>4. Найбільша планета?</p>
    <button onclick="check(this,true)">Юпітер</button>
    <button onclick="check(this,false)">Марс</button>
  </div>

  <div>
    <p>5. Вода це?</p>
    <button onclick="check(this,true)">Рідина</button>
    <button onclick="check(this,false)">Газ</button>
  </div>

  <br><a href="index.html">Назад</a>

  <script>
    function check(btn, isCorrect){
      const parent = btn.parentElement;
      const buttons = parent.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);

      if(isCorrect){
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
      }
    }
  </script>
</body>
</html>
