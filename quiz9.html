<body>

<h2>Квіз 9</h2>

<div>
<p>1. 100-45?</p>
<button onclick="check(this,false)">60</button>

</div>

<div>

<button onclick="check(this,true)">Меркурій</button>
<button onclick="check(this,false)">Марс</button>
</div>

<div>
<p>3. Скільки материків?</p>

</div>

<div>

</div>

<div>

<script>
function check(btn,c){
const p=btn.parentElement; 
p.querySelectorAll('button').forEach(b=>b.disabled=true); 
btn.classList.add(c?'correct':'wrong');
}
</script>
